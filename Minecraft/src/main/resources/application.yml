spring:
  application:
    name: tourism-backend
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_minecraft?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: db_minecraft
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      max-pool-prepared-statement-per-connection-size: -1
      filters: stat,wall,slf4j
      connect-properties:
        druid.stat.mergeSql: true
        druid.stat.slowSqlMillis: 2000
      filter:
        stat:
          enabled: true
          db-type: mysql
          log-slow-sql: true
          slow-sql-millis: 2000
        wall:
          enabled: true
          db-type: mysql
          config:
            delete-allow: true
            drop-table-allow: false
            truncate-allow: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: /druid/*,*.js,*.gif,*.jpg,*.png,*.css,*.ico
        session-stat-enable: true
        session-stat-max-count: 1000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin123
        allow: 127.0.0.1

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  mail:
    host: smtp.qq.com
    port: 465
    username: 2560177364@qq.com
    password: emxnkcjubwyzebjd
    protocol: smtps
    properties:
      mail:
        mime:
          charset: UTF-8
          content-type: text/plain; charset=UTF-8
          encoding: base64
        smtp:
          auth: true
          timeout: 10000
          connectiontimeout: 10000
          writetimeout: 10000
          ssl:
            enable: true
          starttls:
            enable: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.minecraft.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: tourism-secret-key-2024-abcdefghijklmnopqrstuvwxyz1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
  expiration: 604800000

websocket:
  allowed-origins: "*"

file:
  upload-path: ./uploads
  allowed-types: jpg,jpeg,png,gif,bmp,mp3,mp4,wav,amr,pdf,doc,docx,xls,xlsx,ppt,pptx,zip,rar
  max-size: 104857600

# 图片上传配置
image:
  upload:
    # Windows系统上传目录
    windows-dir: D:/Image/
    # Linux/Mac系统上传目录
    unix-dir: /tmp/images/
    # Windows系统访问URL
    windows-url: http://localhost:8080/upload/
    # Linux/Mac系统访问URL
    unix-url: http://43.142.153.247:8888/tmp/images/
    # 水印文字（作用于JPEG/PNG，留空表示不添加水印）
    watermark-text: ""

server:
  port: 8080
  tomcat:
    # 大文件上传被中断时不再强制吞掉剩余请求体，避免连接直接断开
    max-swallow-size: -1
  error:
    include-exception: true
    include-stacktrace: ALWAYS
    include-message: ALWAYS
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

management:
  endpoints:
    web:
      exposure:
        include: metrics,httpexchanges

logging:
  level:
    com.minecraft: debug
    org.springframework: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类

captcha:
  prefix: captcha
  expire:
    default: 120000
  init-default-resource: true
  local-cache-enabled: false
  # 滑块验证码背景图目录（按操作系统自动选择）
  image-dir:
    # Windows 系统（本地开发）
    windows: G:/slidingverification
    # Linux/Mac 系统（服务器部署），需将验证码图片上传到此目录
    unix: /data/slidingverification

# 聚合支付网关
pay:
  # 模拟支付开关：true=所有渠道走 MockChannelAdapter，false=按 channelCode 走真实适配器
  mock-enabled: true
  # 模拟支付时允许的渠道（为空表示全部走 mock）
  mock-channels: MOCK, WECHAT, ALIPAY, UNIONPAY
  # 回调基地址（生产环境必须为公网可访问地址）
  notify-base: ${PAY_NOTIFY_BASE:http://localhost:8080}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    notify-url: ${PAY_NOTIFY_BASE:http://localhost:8080}/api/pay/notify/WECHAT
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    notify-url: ${PAY_NOTIFY_BASE:http://localhost:8080}/api/pay/notify/ALIPAY