<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="博览旅行 - 一站式旅行服务平台，提供景点、酒店、门票、美食等旅行服务" />
    <meta name="keywords" content="旅行,旅游,景点,酒店,门票,美食,攻略" />
    <meta name="author" content="BoLan" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在根目录 .env 文件内配置 -->
    <title>%VITE_APP_TITLE%</title>
    <!-- 首屏前应用主题，避免主题闪烁（与 utils/theme.js 逻辑保持一致） -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme !== 'light' && theme !== 'dark' && theme !== 'game') {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          if (theme === 'dark' || theme === 'game') root.classList.add('dark')
        } catch (e) {
          /* 忽略隐私模式等异常 */
        }
      })()
    </script>
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/attractions.svg" />
    <link rel="stylesheet" href="/tac/css/tac.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
